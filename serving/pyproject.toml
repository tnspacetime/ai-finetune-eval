[project]
name = "ai-finetune-eval-serving"
version = "0.1.0"
description = "Local Apple Silicon inference runtime for our fine-tuning evaluations"
requires-python = ">=3.12,<3.13"
dependencies = [
    "vllm==0.28.0+cpu",
    "vllm-metal==0.28.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

# Same prebuilt wheel pair selected by upstream install.sh --stable.
# vLLM's +cpu wheel supplies the core; vLLM-Metal supplies Apple GPU execution.
[tool.uv.sources]
vllm = { url = "https://github.com/vllm-project/vllm/releases/download/v0.28.0/vllm-0.28.0%2Bcpu-cp312-cp312-macosx_11_0_arm64.whl" }
vllm-metal = { url = "https://github.com/vllm-project/vllm-metal/releases/download/v0.28.0/vllm_metal-0.28.0-cp312-cp312-macosx_15_0_arm64.whl" }
